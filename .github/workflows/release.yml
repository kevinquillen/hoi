name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if git tag does not match package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '${cargo_version}'. Bump version in Cargo.toml and CHANGELOG.md before tagging."
            exit 1
          fi
          echo "Tag v${tag} matches Cargo.toml ${cargo_version}"

  release:
    name: Release - ${{ matrix.platform.os-name }}
    needs: check-version
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-musl
          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
          - os-name: macOS-x86_64
            runs-on: macOS-latest
            target: x86_64-apple-darwin
          - os-name: macOS-aarch64
            runs-on: macOS-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - name: Build hoi binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: "--locked --release"
          strip: true
      - name: Publish GitHub release artifact
        uses: houseabsolute/actions-rust-release@v0
        with:
          changes-file: CHANGELOG.md
          executable-name: hoi
          action-gh-release-parameters: '{ "make_latest": true }'
          target: ${{ matrix.platform.target }}

  publish-homebrew:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Render formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz.sha256' --dir checksums
          sha() { awk '{print $1}' "checksums/hoi-$1.tar.gz.sha256"; }
          mac_arm="$(sha macOS-arm64)"
          mac_x86="$(sha macOS-x86_64)"
          linux_arm="$(sha Linux-musl-arm64)"
          linux_x86="$(sha Linux-musl-x86_64)"

          sed \
            -e "s/version \"[^\"]*\"/version \"${version}\"/" \
            -e "s/REPLACE_WITH_MACOS_ARM64_SHA256/${mac_arm}/" \
            -e "s/REPLACE_WITH_MACOS_X86_64_SHA256/${mac_x86}/" \
            -e "s/REPLACE_WITH_LINUX_ARM64_SHA256/${linux_arm}/" \
            -e "s/REPLACE_WITH_LINUX_X86_64_SHA256/${linux_x86}/" \
            packaging/homebrew/hoi.rb > formula.rb

          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/kevinquillen/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp formula.rb tap/Formula/hoi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hoi.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -q -m "hoi ${version}"
            git push -q origin HEAD
          fi

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    environment: crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - name: Publish
        run: cargo publish --verbose --locked --token ${{ secrets.CARGO_TOKEN }}
